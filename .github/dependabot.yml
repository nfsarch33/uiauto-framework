version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"
    # Ignored deps are skipped entirely — no grouped update and no
    # individual PR. chromedp v0.17+ and its matching cdproto move to the
    # generics API; pkg/uiauto still uses the pre-generics call sites. The
    # weekly group bumped past the break and main stopped compiling (only
    # the nightly caught it). Un-ignore both once the call sites are
    # migrated.
    ignore:
      - dependency-name: github.com/chromedp/chromedp
      - dependency-name: github.com/chromedp/cdproto
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
