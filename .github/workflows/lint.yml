name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
          skip-save-cache: true

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false
      - uses: golang/govulncheck-action@v1
        with:
          cache: false
          go-version-input: "1.27.x"
          go-package: ./...
          repo-checkout: false
