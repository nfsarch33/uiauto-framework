<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><title>Products — Store Admin (fixture)</title>
  <!-- Structured data the SEO eval lane validates: an ItemList of
       Product+Offer records, one per catalogue row. Draft-status rows
       carry no Offer (an unpublished product has no price to a buyer). -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": [
      {"@type": "ListItem", "position": 1, "item": {
        "@type": "Product", "name": "Aluminium Water Bottle",
        "offers": {"@type": "Offer", "price": "29.00", "priceCurrency": "AUD", "availability": "https://schema.org/InStock"}}},
      {"@type": "ListItem", "position": 2, "item": {
        "@type": "Product", "name": "Bamboo Desk Tray",
        "offers": {"@type": "Offer", "price": "19.50", "priceCurrency": "AUD", "availability": "https://schema.org/InStock"}}},
      {"@type": "ListItem", "position": 3, "item": {
        "@type": "Product", "name": "Cork Yoga Block",
        "offers": {"@type": "Offer", "price": "24.00", "priceCurrency": "AUD", "availability": "https://schema.org/InStock"}}}
    ]
  }
  </script>
</head>
<body>
  <h1>Products</h1>
  <table>
    <thead><tr><th>Product</th><th>Status</th><th>Price</th></tr></thead>
    <tbody>
      <tr><td>Aluminium Water Bottle</td><td>Published</td><td>$29.00</td></tr>
      <tr><td>Bamboo Desk Tray</td><td>Draft</td><td>$19.50</td></tr>
      <tr><td>Cork Yoga Block</td><td>Published</td><td>$24.00</td></tr>
    </tbody>
  </table>
  <p><a href="order.html">View order 1042</a></p>
  <p id="done">product list read</p>
</body>
</html>
